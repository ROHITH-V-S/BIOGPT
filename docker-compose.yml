# Two services, both of which the code actually uses.
#
# Postgres (pgvector) was removed rather than wired up: FAISS is this project's
# vector store, so a second vector database would have been resume padding with
# a maintenance cost and nothing calling it. If durable query history or
# multi-tenant corpora are ever needed, that is the point to add it back.
#
# Redis stays because three code paths depend on it — see app/cache.py.
services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env
    environment:
      # Override the .env default: inside the network Redis is a service name,
      # not localhost.
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
    # Lets LLM_BACKEND=ollama reach an Ollama running on the host: inside the
    # container "localhost" is the container. Docker Desktop resolves
    # host.docker.internal already; this adds it on Linux too. Set
    # OLLAMA_BASE_URL=http://host.docker.internal:11434/v1 to use it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      # The image loads spaCy and FAISS at startup, so allow a slow first boot
      # without the container being marked unhealthy.
      start_period: 60s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Caches are regenerable, so bound the memory and evict rather than grow
    # without limit or start refusing writes.
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  backend_data:
