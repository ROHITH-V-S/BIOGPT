server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Forwarded-client headers are set on every proxied location, not just some:
    # the backend rate-limits per client IP, and without X-Forwarded-For every
    # request appears to come from the nginx container — so all users would
    # share a single bucket and one visitor could exhaust everyone's quota.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Server-Sent Events. nginx buffers proxied responses by default, which
    # would hold the token stream until generation finished and silently turn
    # streaming into a single delayed blob. Buffering must be off, HTTP/1.1 is
    # required to keep the connection open, and the read timeout has to outlast
    # a slow generation (a cold local model can take minutes to load).
    location /query {
        proxy_pass http://backend:8000/query;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    location /ingest {
        proxy_pass http://backend:8000/ingest;
        # Ingestion embeds and indexes a whole document; it is slow by nature.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
    }

    # Handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
